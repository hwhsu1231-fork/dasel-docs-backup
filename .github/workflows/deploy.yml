name: deploy

on:
  push:
    branches:
      - "v1"
      - "v2"
      - "v3"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch
        id: branch
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Checking out branch: $BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Determine version from branch or input
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if   [[ "$BRANCH_NAME" == "v1" ]]; then
            VERSION="v1"
          elif [[ "$BRANCH_NAME" == "v2" ]]; then
            VERSION="v2"
          elif [[ "$BRANCH_NAME" == "v3" ]]; then
            VERSION="v3"
          else
            echo "❌ Error: Invalid branch name: $BRANCH_NAME"
            exit 1
          fi
          echo "Using version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build documentation
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Building $VERSION..."
          mdbook build -d "book/$VERSION"

      - name: Create index redirect
        run: |
          LATEST_VERSION="v3"
          mkdir -p book
          cat > book/index.html << INNEREOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=${LATEST_VERSION}/">
            <title>Redirecting to ${LATEST_VERSION}...</title>
          </head>
          <body>
            <p>Redirecting to <a href="${LATEST_VERSION}/">${LATEST_VERSION}</a>...</p>
          </body>
          </html>
          INNEREOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          publish_branch: pages
          keep_files: true
          force_orphan: false
